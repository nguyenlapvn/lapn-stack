# LapN — catch-all default server for TLS: block access via IP / unknown SNI.
# Without this, https://<server-ip> is answered by whichever site happens to own the
# first 443 block. Needs the snakeoil cert (package: ssl-cert), so install.sh only
# enables this file when /etc/ssl/certs/ssl-cert-snakeoil.pem exists.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}
